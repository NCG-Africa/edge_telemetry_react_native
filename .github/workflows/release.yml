name: Release

# Publishing is tag-driven: push a `vX.Y.Z` tag on master and this publishes that
# version to npm. Nothing publishes on a branch push — see ci.yml for those checks.
on:
  push:
    tags:
      - "v*"

permissions:
  # Needed to create the GitHub Release at the end of the job.
  contents: write
  # npm trusted publishing (OIDC). This is what authenticates the publish, so there is
  # no NPM_TOKEN secret to store or rotate — the package must name this repo and this
  # workflow file as a trusted publisher at npmjs.com > package > Settings.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Trusted publishing needs npm >= 11.5.1 / Node >= 22.14. Pinned rather than
          # lts/* so a future LTS rollover cannot silently drop below that floor.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # No `cache:` on purpose — a release build must not restore a warm npm cache.

      # The tag is the release's only input, so a tag that disagrees with package.json
      # would publish a version nobody asked for under a name nobody can find. Fail here
      # instead — the tag is deletable, a published version is not.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing $PKG"

      # `prepare` runs the build, so dist/ exists before the tests that read it.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public --provenance

      # The CHANGELOG section for this version *is* the release notes — writing them
      # twice is how the two come to disagree. A version with no section gets an empty
      # body rather than failing the job: npm is already published by this point, and
      # a missing GitHub Release is fixable by hand while an unpublish is not.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 == "## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::no CHANGELOG section found for $VERSION — publishing an empty release body"
          fi

      # --verify-tag: refuse to invent a tag. The tag is the trigger, so if it is not
      # there something is wrong enough that a silent tag creation would hide it.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
