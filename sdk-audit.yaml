# ============================================================
# 3. Session logic — src/core/telemetry.ts
# ============================================================
session:
  start_rule: >
    Both entries await resumeOrStartSession() INSIDE instancePromise (index.native.ts:77,
    index.web.ts:60), so session.started can never land behind the host app's first event.
    It reads telemetry_session through the Store: a record inside the idle window is adopted
    silently (no session.started); a missing/corrupt/unavailable read starts a fresh session with
    session.reason=launch; an expired record is adopted, finalized under its OWN id and
    start_time, then rotated. evidence telemetry.ts:367-403
  persistence: >
    telemetry_session = {id, start, lastActivity, sequence, eventSequence, eventCount, errorCount,
    sampled, sampleRate}, written on every non-session event and on every acknowledged batch (so a resumed session does not restart
    session.sequence or event.sequence at 0 — restarting either forges duplicate dedup keys). Process death, tab close, hard reload and bfcache restore all resume.
    On web the Store is localStorage, so the session is browser-wide and shared across tabs —
    intended (§4.2). evidence telemetry.ts:422-432, 658, 826
  idle_timeout: 30 min. SESSION_IDLE_MS = 30*60*1000 (telemetry.ts:13); checked in log() via expiryReason() — if now-lastActivity > 30min, rotateSession("idle"). session.* events and metrics don't count as activity. evidence telemetry.ts:409-414, 649-659
  max_duration: 4 h. SESSION_MAX_MS = 4*60*60*1000 (telemetry.ts:16); same lazy check, rotateSession("max_duration"). Idle is tested first — a long session that also went quiet ended because the user left. evidence telemetry.ts:409-414
  background_behavior: >
    NEITHER build rotates on a lifecycle transition (§4.2) — the native background=>finalizeSession /
    foreground=>newSession pair was DELETED in #92, reaching parity by deletion rather than by adding
    one to web. Backgrounding still forces a flush() on native, because the queue only lives in memory
    and the process is then most likely to be killed. evidence index.native.ts:103-119
  sampling: >
    sessionSampleRate (constructor-only, default 1) is rolled ONCE per session — Math.random() <
    rate — and the decision plus the rate it was rolled at travel in the telemetry_session record,
    so a resume adopts them and a relaunch cannot half-sample a session. A rotation re-rolls at the
    CONFIGURED rate, not the retired session's. A sampled-out session enqueues nothing at all —
    no skeleton record, and crashes are NOT exempt (a crash-only exemption makes the unfiltered
    crash-free query read 1/rate too high). Boundary checks still run while sampled out, so the
    rotation that re-rolls happens on schedule. An out-of-range or non-finite rate warns and falls
    back to 1: Math.random() < NaN is always false and would silently mute a deployment. The same
    range check is applied to a RESUMED record — an untrusted rate loses its stuck decision too,
    and the fresh constructor roll stands, rather than shipping a bad divisor.
    session.sample_rate ships on every row so extrapolation is arithmetic (contract 3.6).
    evidence telemetry.ts:198-205, 384-386, 471-480, 556-560, 760, 839, 882
  id_format: "session_{Date.now()}_{16 hex}" + optional "_{platform}" suffix where platform=ios|android (native only; web has NO suffix). Random via crypto.getRandomValues (#91). evidence telemetry.ts:301-304, utils/uuid.ts:12-18, index.web.ts:38

# ============================================================
# 4. Transport
# ============================================================
transport:
  endpoint_path: consumer-supplied full URL via endpoint opt, used verbatim. Default placeholder "https://your.telemetry.endpoint/telemetry", declared once in batch.ts:27 and imported by both senders — the path matches the collector's POST /telemetry (contract 11.1). The previously documented "/collector/telemetry" exists in no artifact and 404s; corrected in README + default (#90).
  auth:
    headers: >
      EVERY POST carries the credential twice — "X-API-Key: <cred>" AND
      "Authorization: Bearer <cred>", same value, built once by buildHeaders() so both senders
      are byte-identical. Both are omitted together when apiKey is absent.
      evidence adapters/batch.ts:13-23, webSender.ts:45, nativeSender.ts:45
    why_both: collector credentialFromRequest reads Authorization when AUTH_MODE=jwt and X-API-Key otherwise — exactly one, never both. Sending both makes one build work in the shared and segmented (bank / on-prem) topologies with no mode flag and no credential-shape sniffing (contract 11.1, #90).
    validation: assertApiKey checks prefix "edge_" + non-empty remainder ONLY, in the factory (createTelemetry.web.ts:20, createTelemetry.native.ts:20). DELIBERATELY not tightened to the collector's >=3-underscore-part API-key check: that would hard-reject every edge_<jwt> and make the segmented deployment unreachable. The real catch is the 401.
  serialization: json. buildBatch() => JSON.stringify({type:"telemetry_batch", timestamp, batch_size, events}). evidence src/adapters/batch.ts:5-12
  compression: none
  batching:
    flush_interval: 30000 ms default (flushIntervalMs; <=0 disables timer). Android's number, deliberately — these SDKs feed shared tables and a per-SDK cadence makes cross-platform arrival comparisons wrong (contract 9.4, #94). evidence telemetry.ts:331
    max_batch_size: 50 events default (batchSize). flush() splices UP TO batchSize per send; flush auto-triggered when queue length >= batchSize. Also Android's number (contract 9.4, #94). evidence telemetry.ts:330
    queue_cap: 500 events, drop-oldest, app.crash evicted LAST (evictIndex scans for the oldest non-crash; when every row is a crash the oldest crash goes rather than growing past the cap). Each eviction books sdk.events_dropped++ / sdk.drop_reason="queue_full". evidence telemetry.ts:26,44-47,1066-1071 (#94)
    crash_path: an app.crash does NOT wait for the batch to fill — flushCrash() persists the WHOLE queue through the Store, reorders crashes to the front, then sends EXACTLY ONE batch. Not a drain: a dying process gets one round trip. The queue is left intact (most app.crash rows are non-fatal — a caught error or a console.error under the default captureConsole), so a successful send leaves ONE duplicate on disk to replay next launch; (session.id, event.sequence) is what makes that free. Each row is written at most once by this path, watermarked on event.sequence (crashPersistedThrough, telemetry.ts:323) — re-persisting the whole queue per crash would fill the store with copies of its own backlog and book store_full drops that are not loss. The batch is spliced BEFORE the send, because the interval and the batch-full trigger both fire flush() unawaited and a post-send splice could delete rows the batch never carried. evidence telemetry.ts:872-920 (#94)
    flush_on_background: true (native only) — finalizeSession() awaits flush() on AppState background. evidence telemetry.ts:316, index.native.ts:93
  retry:
    strategy: native = exponential backoff 500*2^attempts + Math.random()*200 jitter (nativeSender.ts:44-46); web = linear attempts*500 (webSender.ts:45). Retry lives in the sender's send().
    max_attempts: 3 (retryCount default). evidence nativeSender.ts:15, webSender.ts:19
    drop_policy: after 3 failed attempts, core flush() calls sender.onFailure() which persists the batch to storage for later replay. If persistence itself throws, batch is unshifted back onto the in-memory queue. evidence telemetry.ts:640-658
  offline:
    persistence: both senders go through the Store port (#89) under key "telemetry_failed_events" — native via nativeStore()/AsyncStorage, web via webStore()/localStorage, and each entry hands the SAME store to its sender and to core. Replayed on next init (replayFailedNative / constructor replayFailed hook). evidence adapters/failedEvents.ts, nativeSender.ts:13-29,55-84; webSender.ts:14-32,53-70; index.web.ts / index.native.ts
    durability_asymmetry: web persists SYNCHRONOUSLY inside onFailure() (webSender.ts:14-22), so the write lands before the promise settles — the unload-path crash window closes. Native awaits (nativeSender.ts:13-21), so it only narrows. This is why the port is not uniformly async.
    corrupt_payload: a half-written or non-array payload decodes to [] and the key is cleared on any hit, so junk is dropped once instead of being re-read every launch. Previously a bare JSON.parse that threw through replayFailed(). evidence adapters/failedEvents.ts decodeFailed, takeFailed in both senders
    unavailable_storage: reported by the port as {status:"unavailable"} and logged via debug.warn; never throws out of onFailure(). evidence nativeSender.ts:18-20, webSender.ts:19-21
    caps: 500 events AND 1 MB (UTF-8, measured on the encoded payload via TextEncoder), same drop-oldest / app.crash-evicted-last rule as the in-memory queue — encodeFailed() shares evictIndex() with core so the two queues can never disagree about what survives. encodeFailed returns {json, dropped}; both senders return `dropped` from onFailure() and core books it as sdk.events_dropped / sdk.drop_reason="store_full". Real numbers: Android caps AsyncStorage at 6 MB app-wide, web localStorage is the HOST APP's ~5 MB. evidence adapters/failedEvents.ts:29-73, webSender.ts:13-24, nativeSender.ts:16-28, telemetry.ts:1077-1081 (#94, contract 9.4)
    replay_uncounted: a re-persist inside replayFailed() can also evict, and that count is NOT booked — it happens in the sender with no core instance in reach. Contract 3.7 already says these counters are lossy about their own loss; event.sequence gaps are the real coverage.
  sampling_or_throttling: >
    No event-level sampling, rate limiting, deduplication, or config flag found anywhere in
    event creation (log/logMetric), queueing, or send paths. Checked telemetry.ts, both senders,
    batch.ts, all adapters. The ONLY aggregation is frame_render_time: raw requestAnimationFrame
    deltas are rolled up into one metric per 10s window (max/p95/dropped_count) rather than one
    event per frame (frameAggregate.ts:17-34). network_change and app_lifecycle emit only on
    transition (edge-triggered), not throttling. memory_usage is effectively single-shot (see
    inconsistencies). Note: flush() still only sends batchSize (50) events per call — it does
    not loop — so a large backlog drains one batch per flush interval; contract 12.5's draining
    flush() is a separate change. Events beyond the 500-event queue cap ARE now dropped (#94).

# ============================================================
# 5. Privacy & data handling
# ============================================================
privacy:
  ip_handling: no client-side IP collection or transmission found.
  url_sanitization: >
    http.request carries NO per-request URL at any SDK setting (#95): http.url and http.path are removed and
    replaced by http.host (with port, omitted on a relative URL) and http.route, a template normalized SDK-side
    per contract 4.4.1 — nothing raw ever leaves the device and the processor never re-derives. Residue: an
    all-alpha slug such as /accounts/savings survives as itself. view.name's URL rung (#96, the LAST rung)
    reuses the same normalizeRoute() over location.pathname with the query dropped, and there is no view.url —
    so no per-view URL reaches the wire either. STILL UNSANITISED: the deprecated `navigation` event's
    from_screen/to_screen on web are window.location.pathname+search with the query string retained.
    evidence httpAttributes.ts:14-33,64-75,88-121, navigationWeb.web.ts (handleChange)
  user_identifiers: >
    Auto: session.id; device.id ("device_{ms}_{16hex}_{ios|android|web}", SDK-minted and
    persisted through the Store under telemetry_device_id, uninstall-scoped, never rotated —
    #91). user.id is NOT auto-generated: it is consumer-supplied via setUserId /
    setUserProfile({userId}), truncated to 255, and omitted from the wire until supplied.
    Opt-in host identity via setUserProfile/setUserDetails/identify: fullName, firstName,
    lastName, email, phone, avatar, customAttributes — all shipped verbatim in attributes.
  scrubbing_hook: >
    beforeSend(event) => event | null (#93, contract 3.6). Constructor-only on both builds — no
    runtime setter, because registering later leaves a window where session.started and the earliest
    requests have already been enqueued. Runs SYNCHRONOUSLY at ENQUEUE (core/beforeSend.ts, called
    from Telemetry.enqueue at telemetry.ts:1039), over events AND metrics: at enqueue so a failed send
    persists an already-scrubbed batch instead of writing PII to localStorage/AsyncStorage; sync
    because app.crash flushes during teardown. Three tiers, enforced by RE-STAMPING after the hook
    returns and never by throwing — Tier A immutable (type, eventName/metricName, timestamp,
    session.id, session.start_time, session.sequence, event.sequence, all sdk.*, all app.*,
    device.platform, trace.id,
    span.id, parent.span.id, rum.action.id, view.id), Tier B rewritable-not-deletable (device.id —
    deleting it 400s the batch at the collector), Tier C free (user.*, http.*, error.*, vital.target,
    caller data). The hook receives a COPY, so an in-place `delete attrs[k]` cannot defeat the
    re-stamp. A throwing hook FAILS CLOSED (event dropped, sdk.hook_failed++) rather than shipping
    the field it existed to remove; returning null (or nothing) drops it as sdk.hook_dropped++.
    Does NOT cover the collector-added geo block, which is attached after the request leaves the
    device (contract 2.2). KNOWN LAG: both counters are stamped by collectContext() BEFORE the
    hook runs on that row, so a drop first surfaces on the NEXT row and a session's final dropped
    row never reports its own drop — the same "lossy about their own loss" shape contract 3.7
    describes for sdk.events_dropped. Alerting on the number under-reports exactly when the hook
    is worst.
    event.sequence is stamped AFTER the hook (telemetry.ts:1054): a dropped row must not consume
    an ordinal, or every scrub would read as real loss to the backend's gap detection (#94).
    evidence core/beforeSend.ts, core/beforeSend.test.ts, telemetry.ts:1039-1058
  pii_risks: >
    HIGH surface. (1) email/phone/fullName/avatar sent plaintext once profile set.
    (2) the deprecated web `navigation` event keeps its query string (navigationWeb.web.ts handleChange);
        http.request carries no URL (#95) and view.name's URL rung is normalized and query-free (#96).
    (3) crash.message / crash.stacktrace — arbitrary error text, incl. console.error/warn
    args stringified (captureConsole default ON) — may contain user data.
    (4) crash.breadcrumbs — JSON trail of last 20 event names+timestamps.
    (5) http request/response bodies NOT sent, only sizes.

# ============================================================
# 6. Public API surface
# ============================================================
api:
  init_config_options: [apiKey (required, must start with "edge_"), sender, batchSize, flushIntervalMs, endpoint, captureConsole, debug, store, beforeSend, sessionSampleRate, traceHostAllowlist]   # evidence createTelemetry.web.ts / .native.ts; assertApiKey validates edge_ prefix, normalizeAllowlist validates the hosts
  exported_ports:
    store: |
      Store port (#89). Narrow get/set/remove over persisted state, declared in shared core
      (core/store.ts) with no React Native import. Two shapes, and the difference is
      load-bearing: SyncStore (web, localStorage — adapters/web/store.web.ts) completes reads
      before returning; AsyncStore (native, AsyncStorage — adapters/native/store.native.ts)
      settles later. Defaulted per build by the entry (index.web.ts / index.native.ts) and
      overridable via TelemetryOpts.store. Reads return hit | miss | unavailable — storage
      being refused (incognito, partitioned iframe, ITP eviction, full disk) is a distinct
      non-throwing outcome, never conflated with a key that isn't there; it is the population
      device.id_ephemeral reports (#91). memoryStore() ships as an in-memory implementation
      configurable to either shape, and memoryStore({unavailable:true}) is shared core's fallback
      when no store is injected. Consumers today: both senders' offline queue, and core's
      persisted device.id (#91), the resumable session record and the sticky sample decision that
      rides in it (#92, #93), and the capped offline store (#94).
      evidence core/store.ts, core/memoryStore.ts, adapters/web/store.web.ts,
      adapters/native/store.native.ts, telemetry.ts:169, index.web.ts / index.native.ts
  custom_event_api: "log(event: string, data?: Record<string, any>): Promise<void>"   # index.base.ts:21-24
  user_id_api: "setUserId(id): Promise<void>"      # index.base.ts:45-48. generateUserId() REMOVED in #91 — the SDK no longer mints anonymous user ids.
  other_public_methods:
    - "flush(): Promise<void>"
    - "shutdown(): Promise<void>"                # clears flush timer + final flush
    - "setUserProfile(profile) / setUserDetails(details) / updateUserProfile(updates) / getUserProfile() / clearUserProfile()"
    - "setUserName(fullName, firstName?, lastName?) / setUserContact(email?, phone?)"
    - "identify({name?, email?, phone?, avatar?, customAttributes?}) => emits user.profile.update"
    - "trackErrors({captureConsole?})"
    - "getDeviceInfo() / getNetworkInfo()"
    - "attachNavigation(ref) — BOTH builds as of #96; getCurrentRoute() is a navigation-tree API, not a native one"
    - "TelemetryNative only: trackRoute(from,to), screenStart(name), screenEnd(name), interactionProps()"
    - "trackFrameDrops/trackNetworkRequests/trackMemoryUsage/autoTrackNavigation — auto-started in constructor, not meant for direct call"

