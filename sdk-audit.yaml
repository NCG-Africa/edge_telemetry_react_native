repo: NCG-Africa/edge_telemetry_react_native
component_type: sdk
platform: react-native   # dual build: react-native + web (React Native Web), file-split at build time
language: TypeScript
current_version: 3.1.0    # package.json "version"
build_variants: dual entry — web (dist/index.web.js|.cjs) + native (dist/index.native.js|.cjs), selected by package.json exports/react-native fields; bundler is Vite (package.json "build": "vite build")
registry: npm            # @nathanclaire/edge-telemetry-sdk, publishConfig.access=public

# ============================================================
# 1. Events emitted
# All events built in src/core/telemetry.ts. Every emitted name is checked against
# ALLOWED_NAMES (telemetry.ts:16-22); unknown names are rewritten to eventName="custom_event"
# with the original name carried in attributes["event.name"] (telemetry.ts:489-494).
# Two wire shapes:
#   event : { type:"event",  eventName,  timestamp, attributes }   (log(), telemetry.ts:503-508)
#   metric: { type:"metric", metricName, value, timestamp, attributes } (logMetric(), telemetry.ts:587-593)
# Every event/metric ALSO carries the full common_attributes block (section 2).
# ============================================================
events:
  - name: session.started
    trigger: >
      SDK init when no durable session is resumable, and either boundary rotation (30-min idle,
      4-hour cap). A RESUMED session does not re-emit it (§4.1), so COUNT(session.started) still
      equals session count. evidence src/core/telemetry.ts:435-441 (startSession), 367-373
      (resumeOrStartSession); index.native.ts:77, index.web.ts:60
    payload_fields:
      - {field: session.reason, type: string, unit: none, always_present: true}   # launch|idle|max_duration (#92)

  - name: session.finalized
    trigger: >
      Boundary rotation only — 30-min idle or the 4-hour cap, detected either in log() or lazily at
      the next init. NO LONGER fired on native background (#92). duration_ms/event_count stay on the
      wire though the backend derives both (§4.2): the event survives as the carrier for
      session.reason and sdk.error_count. evidence src/core/telemetry.ts:450-457, 471-474
    payload_fields:
      - {field: session.duration_ms, type: int, unit: ms, always_present: true}   # stamped from lastActivity, never now
      - {field: session.event_count, type: int, unit: none, always_present: true}
      - {field: sdk.error_count, type: int, unit: none, always_present: true}
      - {field: session.reason, type: string, unit: none, always_present: true}   # idle|max_duration (#92)

  - name: app_lifecycle
    trigger: foreground/background transition — native RN AppState, web document visibilitychange. Only on a state CHANGE. evidence src/adapters/appLifecycle.ts:16-23
    payload_fields:
      - {field: app_lifecycle.state, type: string, unit: none, always_present: true}   # "foreground" | "background"

  - name: navigation
    trigger: route change (React Navigation state listener native / history+popstate web) AND screenStart(). evidence src/adapters/navigationTracker.ts:12-19; src/adapters/screenTiming.ts:14-24
    payload_fields:
      - {field: navigation.from_screen, type: string, unit: none, always_present: false}   # null on first screenStart
      - {field: navigation.to_screen, type: string, unit: none, always_present: true}
      - {field: navigation.method, type: string, unit: none, always_present: true}         # "push" (route change) | "screen_start" (screenStart)
      - {field: navigation.route_type, type: string, unit: none, always_present: true}     # "screen"

  - name: screen.duration
    trigger: screenEnd(name) — dwell time since matching screenStart. evidence src/adapters/screenTiming.ts:27-39
    payload_fields:
      - {field: screen.name, type: string, unit: none, always_present: true}
      - {field: screen.duration_ms, type: int, unit: ms, always_present: true}
      - {field: screen.exit_method, type: string, unit: none, always_present: true}        # "navigation"

  - name: http.request
    trigger: intercepted fetch (web+native) and XMLHttpRequest (web). Skips the SDK's own collector POST. evidence src/adapters/httpAttributes.ts:5-36; native interceptFetchNative.native.ts:52-60; web interceptFetchWeb.web.ts:67-75,122-130
    payload_fields:
      - {field: http.url, type: string, unit: none, always_present: true}
      - {field: http.method, type: string, unit: none, always_present: true}
      - {field: http.status_code, type: int, unit: none, always_present: true}            # 0 on network error / no response
      - {field: http.duration_ms, type: int, unit: ms, always_present: true}
      - {field: http.success, type: bool, unit: none, always_present: true}               # !error && 200<=status<400
      - {field: http.host, type: string, unit: none, always_present: false}               # only if URL parses
      - {field: http.path, type: string, unit: none, always_present: false}               # only if URL parses; NOT query-stripped (see privacy)
      - {field: http.request_size, type: int, unit: bytes, always_present: false}         # only when request body is a string (.length, NOT bytes)
      - {field: http.response_size, type: int, unit: bytes, always_present: false}        # from content-length header, only if truthy

  - name: app.crash
    trigger: JS global error (ErrorUtils native / window.onerror web), unhandled promise rejection, and (opt-out, default ON) console.error/console.warn. evidence src/adapters/crashCapture.ts:6-49; native crashHandlerNative.native.ts:15-45; web crashHandler.web.ts:15-29
    payload_fields:
      - {field: crash.cause, type: string, unit: none, always_present: true}              # "Error"|"UnhandledRejection"|"ConsoleError"|"ConsoleWarn"
      - {field: crash.message, type: string, unit: none, always_present: true}            # may be null
      - {field: crash.stacktrace, type: string, unit: none, always_present: true}         # may be null; absent for console captures
      - {field: crash.fatal, type: bool, unit: none, always_present: false}               # only for native ErrorUtils path (isFatal)
      - {field: crash.breadcrumbs, type: string, unit: none, always_present: true}        # JSON-stringified array of last 20 {name,timestamp}; evidence telemetry.ts:497-498, breadcrumbs.ts

  - name: user.interaction
    trigger: native tap, best-effort — consumer must spread telemetry.interactionProps() onto app root <View>. NOT auto-wired; web has NO interaction capture. evidence src/adapters/interaction.ts:14-31; index.native.ts:168-172
    payload_fields:
      - {field: interaction.type, type: string, unit: none, always_present: true}         # "tap"
      - {field: interaction.screen, type: string, unit: none, always_present: false}      # only when currentScreen known

  - name: network_change
    trigger: connectivity TYPE transition (NetInfo native / navigator.connection+online/offline web). Only on actual change. evidence src/adapters/networkChange.ts:16-25; native networkInfo.native.ts:31-38; web networkInfo.web.ts:36-53
    payload_fields:
      - {field: network.previous_type, type: string, unit: none, always_present: true}
      - {field: network.type, type: string, unit: none, always_present: false}            # current type; may be undefined

  - name: user.profile.update
    trigger: identify() call. Emits once after merging host identity into profile; carries no user.id of its own, so traffic stays anonymous unless setUserId was called (#91). evidence src/core/telemetry.ts:435-460
    payload_fields: []   # profile fields ride via common_attributes (user.* keys)

  - name: custom_event
    trigger: any log(name, data) where name is NOT in ALLOWED_NAMES. evidence src/core/telemetry.ts:489-494
    payload_fields:
      - {field: event.name, type: string, unit: none, always_present: true}               # original caller-supplied name
      # plus arbitrary caller data flattened dot-notation into attributes

  - name: frame_render_time   # METRIC (type:"metric")
    trigger: aggregated once per 10s window from requestAnimationFrame deltas (web+native). value = p95 frame time (ms). evidence src/adapters/frameAggregate.ts:17-34; native frameDropsNative.native.ts:20-41; web frameDropsWeb.web.ts:20-40
    payload_fields:
      - {field: value, type: float, unit: ms, always_present: true}                       # top-level metric value = p95
      - {field: frame.max_ms, type: float, unit: ms, always_present: true}
      - {field: frame.p95_ms, type: float, unit: ms, always_present: true}
      - {field: frame.dropped_count, type: int, unit: none, always_present: true}         # frames slower than 2x budget
      - {field: frame.target_hz, type: int, unit: none, always_present: true}             # 60
      - {field: frame.source, type: string, unit: none, always_present: true}             # "requestAnimationFrame"

  - name: memory_usage   # METRIC (type:"metric")
    trigger: recordMemoryUsage(). NOTE: fires only ONCE at init in practice — periodic start() is never called (see inconsistencies). value = used JS heap MB. Skipped if perf.memory unavailable. evidence src/adapters/native/memoryNative.native.ts:32-47; web memoryWeb.web.ts:29-44
    payload_fields:
      - {field: value, type: float, unit: MB, always_present: true}                       # top-level metric value = used heap MB
      - {field: memory.usage_mb, type: float, unit: MB, always_present: true}
      - {field: memory.pressure_level, type: string, unit: none, always_present: true}    # "low"<256 | "moderate"<512 | "high"
      - {field: memory.unit, type: string, unit: none, always_present: true}              # "MB"
      - {field: memory.type, type: string, unit: none, always_present: true}              # "heap"
      - {field: memory.source, type: string, unit: none, always_present: true}            # Platform.OS (native) | "performance.memory" (web)

# Allowlisted but NEVER emitted (no producer found in src): page_load, resource_timing,
# long_task, LCP, FCP, CLS, INP, TTFB. evidence telemetry.ts:19-21 (ALLOWED_NAMES only).

# ============================================================
# 2. Common attributes — attached to EVERY event and metric
# Built in src/core/telemetry.ts collectContext() (lines 582-641). Device info flattened
# with empty prefix (keys already app.*/device.*), network flattened with "network" prefix.
# ============================================================
common_attributes:
  # --- identity / session / sdk (always present) ---
  - {field: user.id, type: string, unit: none, always_present: false, evidence: telemetry.ts:957}    # consumer-supplied, truncated to 255; OMITTED on anonymous traffic (#91)
  - {field: device.id, type: string, unit: none, always_present: true, evidence: telemetry.ts:954}    # SDK-minted "device_{ms}_{16hex}_{ios|android|web}", persisted via Store key telemetry_device_id (#91)
  - {field: device.id_ephemeral, type: bool, unit: none, always_present: false, evidence: telemetry.ts:955}   # true only when the Store reported unavailable; omitted when false (#91)
  - {field: session.id, type: string, unit: none, always_present: true, evidence: telemetry.ts:958}
  - {field: session.start_time, type: string, unit: none, always_present: true, evidence: telemetry.ts:959}   # ISO 8601
  - {field: session.sequence, type: int, unit: none, always_present: true, evidence: telemetry.ts:960}         # ++ per acknowledged batch
  - {field: event.sequence, type: int, unit: none, always_present: true, evidence: telemetry.ts:1054}          # per-session ordinal, stamped AFTER beforeSend; persisted with the session so a resume continues it. (session.id, event.sequence) is the backend dedup key; gaps = real loss, duplicates = replay (#94, contract 2.4)
  - {field: sdk.platform, type: string, unit: none, always_present: true, evidence: telemetry.ts:970}          # constant "react-native" (BOTH web & native)
  - {field: sdk.version, type: string, unit: none, always_present: true, evidence: telemetry.ts:971}           # package.json version
  - {field: session.sample_rate, type: float, unit: none, always_present: true, evidence: telemetry.ts:963}    # 0.0-1.0, the rate THIS session was rolled at (#93); absent => assume 1.0
  - {field: sdk.hook_dropped, type: int, unit: none, always_present: true, evidence: telemetry.ts:968}         # monotonic; beforeSend returned null — the hook WORKING (#93)
  - {field: sdk.hook_failed, type: int, unit: none, always_present: true, evidence: telemetry.ts:969}          # monotonic; beforeSend threw — the hook BROKEN (#93)
  - {field: sdk.events_dropped, type: int, unit: none, always_present: true, evidence: telemetry.ts:966}       # monotonic, process-lifetime (NOT reset by a session rotation); 0 until the first drop (#94)
  - {field: sdk.drop_reason, type: string, unit: none, always_present: false, evidence: telemetry.ts:967}      # OMITTED until a drop occurs; domain queue_full|store_full|rejected — "rejected" has no producer yet (needs 4xx-drops-the-batch, #113)
  # --- device block (from DeviceInfo handler; present when collect() succeeds) ---
  - {field: app.name, type: string, unit: none, always_present: false, evidence: adapters/native/deviceInfo.native.ts:52 / web/deviceInfo.web.ts:16}
  - {field: app.version, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:53}
  - {field: app.build_number, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:55}
  - {field: app.package_name, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:56}   # web: window.location.hostname
  - {field: device.platform, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:60}   # "ios"|"android"|"web"
  - {field: device.platform_version, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:61}
  - {field: device.model, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:62}      # web: userAgent
  - {field: device.manufacturer, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:63}
  - {field: device.brand, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:64}
  - {field: device.android_sdk, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:67}       # android only
  - {field: device.android_release, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:68}   # android only
  - {field: device.fingerprint, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:44}      # android only
  - {field: device.hardware, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:44}         # android only
  - {field: device.product, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:45}          # android only
  - {field: device.ios_system_name, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:48}    # ios only
  - {field: device.iosDeviceName, type: string, unit: none, always_present: false, evidence: deviceInfo.native.ts:49}    # ios only
  # --- network block (from NetworkInfo handler) ---
  - {field: network.type, type: string, unit: none, always_present: false, evidence: adapters/native/networkInfo.native.ts:19}    # "wifi"/"cellular"/"unknown"
  - {field: network.is_connected, type: bool, unit: none, always_present: false, evidence: networkInfo.native.ts:19}
  # --- user profile (only when a profile is set; undefined values dropped) ---
  - {field: user.name, type: string, unit: none, always_present: false, evidence: telemetry.ts:976}      # = fullName (v3 contract key)
  - {field: user.fullName, type: string, unit: none, always_present: false, evidence: telemetry.ts:977}
  - {field: user.firstName, type: string, unit: none, always_present: false, evidence: telemetry.ts:978}
  - {field: user.lastName, type: string, unit: none, always_present: false, evidence: telemetry.ts:979}
  - {field: user.email, type: string, unit: none, always_present: false, evidence: telemetry.ts:980}
  - {field: user.phone, type: string, unit: none, always_present: false, evidence: telemetry.ts:981}
  - {field: user.avatar, type: string, unit: none, always_present: false, evidence: telemetry.ts:982}
  - {field: user.createdAt, type: int, unit: ms, always_present: false, evidence: telemetry.ts:983}      # Date.now() ms epoch
  - {field: user.updatedAt, type: int, unit: ms, always_present: false, evidence: telemetry.ts:984}
  - {field: "user.custom.*", type: object, unit: none, always_present: false, evidence: telemetry.ts:567}   # flattened customAttributes

# ============================================================
# 3. Session logic — src/core/telemetry.ts
# ============================================================
session:
  start_rule: >
    Both entries await resumeOrStartSession() INSIDE instancePromise (index.native.ts:77,
    index.web.ts:60), so session.started can never land behind the host app's first event.
    It reads telemetry_session through the Store: a record inside the idle window is adopted
    silently (no session.started); a missing/corrupt/unavailable read starts a fresh session with
    session.reason=launch; an expired record is adopted, finalized under its OWN id and
    start_time, then rotated. evidence telemetry.ts:367-403
  persistence: >
    telemetry_session = {id, start, lastActivity, sequence, eventSequence, eventCount, errorCount,
    sampled, sampleRate}, written on every non-session event and on every acknowledged batch (so a resumed session does not restart
    session.sequence or event.sequence at 0 — restarting either forges duplicate dedup keys). Process death, tab close, hard reload and bfcache restore all resume.
    On web the Store is localStorage, so the session is browser-wide and shared across tabs —
    intended (§4.2). evidence telemetry.ts:422-432, 658, 826
  idle_timeout: 30 min. SESSION_IDLE_MS = 30*60*1000 (telemetry.ts:13); checked in log() via expiryReason() — if now-lastActivity > 30min, rotateSession("idle"). session.* events and metrics don't count as activity. evidence telemetry.ts:409-414, 649-659
  max_duration: 4 h. SESSION_MAX_MS = 4*60*60*1000 (telemetry.ts:16); same lazy check, rotateSession("max_duration"). Idle is tested first — a long session that also went quiet ended because the user left. evidence telemetry.ts:409-414
  background_behavior: >
    NEITHER build rotates on a lifecycle transition (§4.2) — the native background=>finalizeSession /
    foreground=>newSession pair was DELETED in #92, reaching parity by deletion rather than by adding
    one to web. Backgrounding still forces a flush() on native, because the queue only lives in memory
    and the process is then most likely to be killed. evidence index.native.ts:103-119
  sampling: >
    sessionSampleRate (constructor-only, default 1) is rolled ONCE per session — Math.random() <
    rate — and the decision plus the rate it was rolled at travel in the telemetry_session record,
    so a resume adopts them and a relaunch cannot half-sample a session. A rotation re-rolls at the
    CONFIGURED rate, not the retired session's. A sampled-out session enqueues nothing at all —
    no skeleton record, and crashes are NOT exempt (a crash-only exemption makes the unfiltered
    crash-free query read 1/rate too high). Boundary checks still run while sampled out, so the
    rotation that re-rolls happens on schedule. An out-of-range or non-finite rate warns and falls
    back to 1: Math.random() < NaN is always false and would silently mute a deployment. The same
    range check is applied to a RESUMED record — an untrusted rate loses its stuck decision too,
    and the fresh constructor roll stands, rather than shipping a bad divisor.
    session.sample_rate ships on every row so extrapolation is arithmetic (contract 3.6).
    evidence telemetry.ts:198-205, 384-386, 471-480, 556-560, 760, 839, 882
  id_format: "session_{Date.now()}_{16 hex}" + optional "_{platform}" suffix where platform=ios|android (native only; web has NO suffix). Random via crypto.getRandomValues (#91). evidence telemetry.ts:301-304, utils/uuid.ts:12-18, index.web.ts:38

# ============================================================
# 4. Transport
# ============================================================
transport:
  endpoint_path: consumer-supplied full URL via endpoint opt, used verbatim. Default placeholder "https://your.telemetry.endpoint/telemetry", declared once in batch.ts:27 and imported by both senders — the path matches the collector's POST /telemetry (contract 11.1). The previously documented "/collector/telemetry" exists in no artifact and 404s; corrected in README + default (#90).
  auth:
    headers: >
      EVERY POST carries the credential twice — "X-API-Key: <cred>" AND
      "Authorization: Bearer <cred>", same value, built once by buildHeaders() so both senders
      are byte-identical. Both are omitted together when apiKey is absent.
      evidence adapters/batch.ts:13-23, webSender.ts:45, nativeSender.ts:45
    why_both: collector credentialFromRequest reads Authorization when AUTH_MODE=jwt and X-API-Key otherwise — exactly one, never both. Sending both makes one build work in the shared and segmented (bank / on-prem) topologies with no mode flag and no credential-shape sniffing (contract 11.1, #90).
    validation: assertApiKey checks prefix "edge_" + non-empty remainder ONLY, in the factory (createTelemetry.web.ts:20, createTelemetry.native.ts:20). DELIBERATELY not tightened to the collector's >=3-underscore-part API-key check: that would hard-reject every edge_<jwt> and make the segmented deployment unreachable. The real catch is the 401.
  serialization: json. buildBatch() => JSON.stringify({type:"telemetry_batch", timestamp, batch_size, events}). evidence src/adapters/batch.ts:5-12
  compression: none
  batching:
    flush_interval: 30000 ms default (flushIntervalMs; <=0 disables timer). Android's number, deliberately — these SDKs feed shared tables and a per-SDK cadence makes cross-platform arrival comparisons wrong (contract 9.4, #94). evidence telemetry.ts:331
    max_batch_size: 50 events default (batchSize). flush() splices UP TO batchSize per send; flush auto-triggered when queue length >= batchSize. Also Android's number (contract 9.4, #94). evidence telemetry.ts:330
    queue_cap: 500 events, drop-oldest, app.crash evicted LAST (evictIndex scans for the oldest non-crash; when every row is a crash the oldest crash goes rather than growing past the cap). Each eviction books sdk.events_dropped++ / sdk.drop_reason="queue_full". evidence telemetry.ts:26,44-47,1066-1071 (#94)
    crash_path: an app.crash does NOT wait for the batch to fill — flushCrash() persists the WHOLE queue through the Store, reorders crashes to the front, then sends EXACTLY ONE batch. Not a drain: a dying process gets one round trip. The queue is left intact (most app.crash rows are non-fatal — a caught error or a console.error under the default captureConsole), so a successful send leaves ONE duplicate on disk to replay next launch; (session.id, event.sequence) is what makes that free. Each row is written at most once by this path, watermarked on event.sequence (crashPersistedThrough, telemetry.ts:323) — re-persisting the whole queue per crash would fill the store with copies of its own backlog and book store_full drops that are not loss. The batch is spliced BEFORE the send, because the interval and the batch-full trigger both fire flush() unawaited and a post-send splice could delete rows the batch never carried. evidence telemetry.ts:872-920 (#94)
    flush_on_background: true (native only) — finalizeSession() awaits flush() on AppState background. evidence telemetry.ts:316, index.native.ts:93
  retry:
    strategy: native = exponential backoff 500*2^attempts + Math.random()*200 jitter (nativeSender.ts:44-46); web = linear attempts*500 (webSender.ts:45). Retry lives in the sender's send().
    max_attempts: 3 (retryCount default). evidence nativeSender.ts:15, webSender.ts:19
    drop_policy: after 3 failed attempts, core flush() calls sender.onFailure() which persists the batch to storage for later replay. If persistence itself throws, batch is unshifted back onto the in-memory queue. evidence telemetry.ts:640-658
  offline:
    persistence: both senders go through the Store port (#89) under key "telemetry_failed_events" — native via nativeStore()/AsyncStorage, web via webStore()/localStorage, and each entry hands the SAME store to its sender and to core. Replayed on next init (replayFailedNative / constructor replayFailed hook). evidence adapters/failedEvents.ts, nativeSender.ts:13-29,55-84; webSender.ts:14-32,53-70; index.web.ts / index.native.ts
    durability_asymmetry: web persists SYNCHRONOUSLY inside onFailure() (webSender.ts:14-22), so the write lands before the promise settles — the unload-path crash window closes. Native awaits (nativeSender.ts:13-21), so it only narrows. This is why the port is not uniformly async.
    corrupt_payload: a half-written or non-array payload decodes to [] and the key is cleared on any hit, so junk is dropped once instead of being re-read every launch. Previously a bare JSON.parse that threw through replayFailed(). evidence adapters/failedEvents.ts decodeFailed, takeFailed in both senders
    unavailable_storage: reported by the port as {status:"unavailable"} and logged via debug.warn; never throws out of onFailure(). evidence nativeSender.ts:18-20, webSender.ts:19-21
    caps: 500 events AND 1 MB (UTF-8, measured on the encoded payload via TextEncoder), same drop-oldest / app.crash-evicted-last rule as the in-memory queue — encodeFailed() shares evictIndex() with core so the two queues can never disagree about what survives. encodeFailed returns {json, dropped}; both senders return `dropped` from onFailure() and core books it as sdk.events_dropped / sdk.drop_reason="store_full". Real numbers: Android caps AsyncStorage at 6 MB app-wide, web localStorage is the HOST APP's ~5 MB. evidence adapters/failedEvents.ts:29-73, webSender.ts:13-24, nativeSender.ts:16-28, telemetry.ts:1077-1081 (#94, contract 9.4)
    replay_uncounted: a re-persist inside replayFailed() can also evict, and that count is NOT booked — it happens in the sender with no core instance in reach. Contract 3.7 already says these counters are lossy about their own loss; event.sequence gaps are the real coverage.
  sampling_or_throttling: >
    No event-level sampling, rate limiting, deduplication, or config flag found anywhere in
    event creation (log/logMetric), queueing, or send paths. Checked telemetry.ts, both senders,
    batch.ts, all adapters. The ONLY aggregation is frame_render_time: raw requestAnimationFrame
    deltas are rolled up into one metric per 10s window (max/p95/dropped_count) rather than one
    event per frame (frameAggregate.ts:17-34). network_change and app_lifecycle emit only on
    transition (edge-triggered), not throttling. memory_usage is effectively single-shot (see
    inconsistencies). Note: flush() still only sends batchSize (50) events per call — it does
    not loop — so a large backlog drains one batch per flush interval; contract 12.5's draining
    flush() is a separate change. Events beyond the 500-event queue cap ARE now dropped (#94).

# ============================================================
# 5. Privacy & data handling
# ============================================================
privacy:
  ip_handling: no client-side IP collection or transmission found.
  url_sanitization: NONE. http.url is the raw full URL including query string; http.path = URL.pathname (query kept on http.url, not stripped). Web navigation captures window.location.pathname+search (query string retained). evidence httpAttributes.ts:16-31, navigationWeb.web.ts:42
  user_identifiers: >
    Auto: session.id; device.id ("device_{ms}_{16hex}_{ios|android|web}", SDK-minted and
    persisted through the Store under telemetry_device_id, uninstall-scoped, never rotated —
    #91). user.id is NOT auto-generated: it is consumer-supplied via setUserId /
    setUserProfile({userId}), truncated to 255, and omitted from the wire until supplied.
    Opt-in host identity via setUserProfile/setUserDetails/identify: fullName, firstName,
    lastName, email, phone, avatar, customAttributes — all shipped verbatim in attributes.
  scrubbing_hook: >
    beforeSend(event) => event | null (#93, contract 3.6). Constructor-only on both builds — no
    runtime setter, because registering later leaves a window where session.started and the earliest
    requests have already been enqueued. Runs SYNCHRONOUSLY at ENQUEUE (core/beforeSend.ts, called
    from Telemetry.enqueue at telemetry.ts:1039), over events AND metrics: at enqueue so a failed send
    persists an already-scrubbed batch instead of writing PII to localStorage/AsyncStorage; sync
    because app.crash flushes during teardown. Three tiers, enforced by RE-STAMPING after the hook
    returns and never by throwing — Tier A immutable (type, eventName/metricName, timestamp,
    session.id, session.start_time, session.sequence, event.sequence, all sdk.*, all app.*,
    device.platform, trace.id,
    span.id, parent.span.id, rum.action.id, view.id), Tier B rewritable-not-deletable (device.id —
    deleting it 400s the batch at the collector), Tier C free (user.*, http.*, error.*, vital.target,
    caller data). The hook receives a COPY, so an in-place `delete attrs[k]` cannot defeat the
    re-stamp. A throwing hook FAILS CLOSED (event dropped, sdk.hook_failed++) rather than shipping
    the field it existed to remove; returning null (or nothing) drops it as sdk.hook_dropped++.
    Does NOT cover the collector-added geo block, which is attached after the request leaves the
    device (contract 2.2). KNOWN LAG: both counters are stamped by collectContext() BEFORE the
    hook runs on that row, so a drop first surfaces on the NEXT row and a session's final dropped
    row never reports its own drop — the same "lossy about their own loss" shape contract 3.7
    describes for sdk.events_dropped. Alerting on the number under-reports exactly when the hook
    is worst.
    event.sequence is stamped AFTER the hook (telemetry.ts:1054): a dropped row must not consume
    an ordinal, or every scrub would read as real loss to the backend's gap detection (#94).
    evidence core/beforeSend.ts, core/beforeSend.test.ts, telemetry.ts:1039-1058
  pii_risks: >
    HIGH surface. (1) email/phone/fullName/avatar sent plaintext once profile set.
    (2) http.url carries full URLs incl. query strings (tokens/PII in query params leak).
    (3) crash.message / crash.stacktrace — arbitrary error text, incl. console.error/warn
    args stringified (captureConsole default ON) — may contain user data.
    (4) crash.breadcrumbs — JSON trail of last 20 event names+timestamps.
    (5) http request/response bodies NOT sent, only sizes.

# ============================================================
# 6. Public API surface
# ============================================================
api:
  init_config_options: [apiKey (required, must start with "edge_"), sender, batchSize, flushIntervalMs, endpoint, captureConsole, debug, store, beforeSend, sessionSampleRate]   # evidence createTelemetry.web.ts:4-13 / .native.ts; assertApiKey validates edge_ prefix
  exported_ports:
    store: |
      Store port (#89). Narrow get/set/remove over persisted state, declared in shared core
      (core/store.ts) with no React Native import. Two shapes, and the difference is
      load-bearing: SyncStore (web, localStorage — adapters/web/store.web.ts) completes reads
      before returning; AsyncStore (native, AsyncStorage — adapters/native/store.native.ts)
      settles later. Defaulted per build by the entry (index.web.ts / index.native.ts) and
      overridable via TelemetryOpts.store. Reads return hit | miss | unavailable — storage
      being refused (incognito, partitioned iframe, ITP eviction, full disk) is a distinct
      non-throwing outcome, never conflated with a key that isn't there; it is the population
      device.id_ephemeral reports (#91). memoryStore() ships as an in-memory implementation
      configurable to either shape, and memoryStore({unavailable:true}) is shared core's fallback
      when no store is injected. Consumers today: both senders' offline queue, and core's
      persisted device.id (#91), the resumable session record and the sticky sample decision that
      rides in it (#92, #93), and the capped offline store (#94).
      evidence core/store.ts, core/memoryStore.ts, adapters/web/store.web.ts,
      adapters/native/store.native.ts, telemetry.ts:169, index.web.ts / index.native.ts
  custom_event_api: "log(event: string, data?: Record<string, any>): Promise<void>"   # index.base.ts:21-24
  user_id_api: "setUserId(id): Promise<void>"      # index.base.ts:45-48. generateUserId() REMOVED in #91 — the SDK no longer mints anonymous user ids.
  other_public_methods:
    - "flush(): Promise<void>"
    - "shutdown(): Promise<void>"                # clears flush timer + final flush
    - "setUserProfile(profile) / setUserDetails(details) / updateUserProfile(updates) / getUserProfile() / clearUserProfile()"
    - "setUserName(fullName, firstName?, lastName?) / setUserContact(email?, phone?)"
    - "identify({name?, email?, phone?, avatar?, customAttributes?}) => emits user.profile.update"
    - "trackErrors({captureConsole?})"
    - "getDeviceInfo() / getNetworkInfo()"
    - "TelemetryNative only: attachNavigation(ref), trackRoute(from,to), screenStart(name), screenEnd(name), interactionProps()"
    - "trackFrameDrops/trackNetworkRequests/trackMemoryUsage/autoTrackNavigation — auto-started in constructor, not meant for direct call"

# ============================================================
# 7. Feature checklist
# ============================================================
features:
  sampling-and-scrubbing: {status: done, evidence: "core/beforeSend.ts + telemetry.ts:198-205, 384-386, 760, 882, 905-916", notes: "sessionSampleRate sticky per session and re-rolled at rotation; beforeSend sync at enqueue over events and metrics with A/B/C tier re-stamping and fail-closed (#93). Both constructor-only, both builds, shared core."}
  session-tracking: {status: done, evidence: "telemetry.ts:367-474 + index.native.ts:77, index.web.ts:60", notes: "resume through the Store across process death; 30-min idle + 4-hour cap; session.reason on started/finalized; no lifecycle rotation on either build (#92)"}
  view-tracking: {status: done, evidence: screenTiming.ts + navigationTracker.ts, notes: "navigation (route + screenStart) and screen.duration events"}
  error-capture: {status: done, evidence: crashCapture.ts + crashHandler.web.ts/crashHandlerNative.native.ts, notes: "JS errors, unhandled rejections, console.error/warn -> app.crash"}
  crash-capture: {status: partial, evidence: crashHandlerNative.native.ts:15-25, notes: "JS-level only (ErrorUtils/window.onerror). No native iOS/Android signal/ANR crash capture. crash.fatal only on native ErrorUtils path"}
  network-capture: {status: done, evidence: interceptFetchNative.native.ts + interceptFetchWeb.web.ts, notes: "fetch both platforms; XHR web only; bodies not sent, sizes only"}
  custom-events: {status: done, evidence: telemetry.ts:474-520, notes: "log(); non-allowlisted names remapped to custom_event + event.name"}
  web-vitals: {status: planned, evidence: telemetry.ts:19-21, notes: "LCP/FCP/CLS/INP/TTFB/page_load/resource_timing/long_task allowlisted but NO emitter exists"}
  app-start: {status: na, evidence: none, notes: "no app-start/cold-start timing event found. §4.3 makes it the compensator for #92's resume-without-session.started — see inconsistency 11"}
  anr-detection: {status: na, evidence: none, notes: "not implemented"}
  hang-detection: {status: na, evidence: none, notes: "not implemented"}
  frame-stats: {status: done, evidence: frameAggregate.ts + frameDrops*.ts, notes: "frame_render_time metric, p95/max/dropped per 10s window; rAF-based"}
  batching: {status: done, evidence: telemetry.ts:330-331 + batch.ts, notes: "batchSize default 50, flushIntervalMs 30000, 500-event queue cap, telemetry_batch envelope (#94)"}
  offline-persistence: {status: done, evidence: adapters/failedEvents.ts:29-73 + nativeSender.ts:16-28 + webSender.ts:13-24, notes: "AsyncStorage/localStorage replay, capped at 500 events / 1 MB with app.crash evicted last (#94)"}
  retry-backoff: {status: done, evidence: nativeSender.ts:15-53 + webSender.ts:19-51, notes: "native exponential+jitter, web linear; 3 attempts"}
  no-sampling-guarantee: {status: done, evidence: "grep of full src — telemetry.ts, senders, adapters", notes: "no sampling/rate-limit/dedup; frame aggregation is the only rollup and it drops per-frame granularity by design"}

# ============================================================
# 9. All repos
# ============================================================
inconsistencies_and_surprises: >
  1. memory_usage effectively single-shot: index.*.ts trackMemoryUsage() -> core
     trackMemoryUsage() calls memoryHandler.recordMemoryUsage() ONCE (telemetry.ts:262-264);
     the periodic start()/setInterval (memoryNative.native.ts:55, memoryWeb.web.ts:53) is never
     invoked. So one memory sample per app launch, not every 30s as the code implies.
  2. sdk.platform is the constant "react-native" on BOTH web and native (telemetry.ts:9,552) —
     the web build reports sdk.platform="react-native" while device.platform="web". Divergent.
  3. Web-vitals names (LCP/FCP/CLS/INP/TTFB/page_load/resource_timing/long_task) are in
     ALLOWED_NAMES but have no producers — dead allowlist entries.
  4. session.id gets an ios|android suffix on native and none on web (rule lives in
     generateSessionId, telemetry.ts:301-308); device.id is suffixed on all three from the same
     `platform` opt. Contract §3.3 gives session.id a _web suffix in v4 — not done.
  4b. randomHex() THROWS (no Math.random fallback) when crypto.getRandomValues is missing —
     utils/uuid.ts:12-20. On RN that means react-native-get-random-values failed to load, which
     the native entry warns about first (index.native.ts:29-34).
  6. http.request_size = string .length (chars), not byte length (httpAttributes.ts:32) — mislabeled unit for multibyte bodies.
  7. Query strings are never stripped from http.url or web navigation paths — PII/token leak risk.
  8. console.error/warn capture defaults ON (captureConsole=true) — turns every console.error into
     an app.crash event; noisy apps will emit crash events for non-crashes.
  9. wire envelope has no top-level location field though the type name (telemetry_batch) and
     CLAUDE.md target contract mention an optional location (batch.ts:5-12 omits it).
  10. TelemetryOpts.apiKey typed required in createTelemetry (assertApiKey throws on missing/bad
      prefix), but TelemetryWeb/Native constructors still accept apiKey as optional — validation
      only enforced through the factory, not the class.
  11. #92 made sessions resume without re-emitting session.started, so session.reason="launch"
      now UNDERCOUNTS launches — a relaunch inside the idle window emits no row at all. §4.3's
      app.start is the compensator and is NOT built yet (features.app-start = na). Until it
      lands, do not count app launches from session.reason.
  12. #92 session state is read at init and on a web bfcache restore (pageshow, persisted), NOT
      live-synced. Two tabs open at once share the localStorage record but keep their own
      in-memory lastActivity, so they can diverge and both finalize the same session.id. A
      `storage`-event listener would close it; not built (no AC asked for it).
  13. A Store reporting `unavailable` means the session cannot be resumed, so every launch mints
      one and COUNT(session.started) over-counts that population. There is no session.id_ephemeral
      on the contract to mark it — but the same store failed the device.id round-trip, so those
      events already carry device.id_ephemeral: true. Filter on that.

ci_cd:
  what_exists: >
    .github/workflows/ci.yml — single job on push/PR to master + merge_group: npm ci, npm run
    typecheck (tsc --noEmit), npm test (vitest run), npm run build (vite). Actions pinned by SHA.
    No lint step (repo has no lint script). Contradicts CLAUDE.md's stale note of a yarn/expo CI.
  publishes_to: >
    npm as @nathanclaire/edge-telemetry-sdk (publishConfig.access=public). No publish workflow in
    CI — release/publish appears manual (npm publish); package.json "prepare": vite build builds on install.

open_questions:
  - Is memory_usage meant to sample periodically? If so trackMemoryUsage should call start(), not recordMemoryUsage() once.
  - Should the web build report sdk.platform="web" instead of the hardcoded "react-native"?
  - Are the web-vitals allowlist entries a planned workstream or leftover scaffolding?
  - Backend contract: does the collector expect a top-level `location` in the telemetry_batch envelope? It is not sent.
  - RESOLVED (#94): the offline store now caps at 500 events / 1 MB with app.crash evicted last.
