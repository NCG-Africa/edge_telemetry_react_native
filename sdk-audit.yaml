features:
  sampling-and-scrubbing: {status: done, evidence: "core/beforeSend.ts + telemetry.ts:198-205, 384-386, 760, 882, 905-916", notes: "sessionSampleRate sticky per session and re-rolled at rotation; beforeSend sync at enqueue over events and metrics with A/B/C tier re-stamping and fail-closed (#93). Both constructor-only, both builds, shared core."}
  session-tracking: {status: done, evidence: "telemetry.ts:367-474 + index.native.ts:77, index.web.ts:60", notes: "resume through the Store across process death; 30-min idle + 4-hour cap; session.reason on started/finalized; no lifecycle rotation on either build (#92)"}
  view-loading-time: {status: done, evidence: "adapters/loadingTime.ts + viewManager.ts + the two interceptors + index.*.ts runtime-ready seed", notes: "#97 network settle, ONE shared module for both builds. 1000ms quiet window subtracted back out (the same constant as 4.6's dead-click window), 30s hard cap emitting null not the cap, zero-network null not 0, collector POST out of scope, initial_load seeded from loadEventEnd (web) / performance.rnStartupTiming (native). Requests count to the view they STARTED in. loading_time omitted when null; loading_time_outcome always ships"}
