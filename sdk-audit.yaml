# ============================================================
# 9. All repos
# ============================================================
inconsistencies_and_surprises: >
  1. memory_usage effectively single-shot: index.*.ts trackMemoryUsage() -> core
     trackMemoryUsage() calls memoryHandler.recordMemoryUsage() ONCE (telemetry.ts:262-264);
     the periodic start()/setInterval (memoryNative.native.ts:55, memoryWeb.web.ts:53) is never
     invoked. So one memory sample per app launch, not every 30s as the code implies.
  2. sdk.platform is the constant "react-native" on BOTH web and native (telemetry.ts:9,552) —
     the web build reports sdk.platform="react-native" while device.platform="web". Divergent.
  3. Web-vitals names (LCP/FCP/CLS/INP/TTFB/page_load/resource_timing/long_task) are in
     ALLOWED_NAMES but have no producers — dead allowlist entries.
  4. session.id gets an ios|android suffix on native and none on web (rule lives in
     generateSessionId, telemetry.ts:301-308); device.id is suffixed on all three from the same
     `platform` opt. Contract §3.3 gives session.id a _web suffix in v4 — not done.
  4b. randomHex() THROWS (no Math.random fallback) when crypto.getRandomValues is missing —
     utils/uuid.ts:12-20. On RN that means react-native-get-random-values failed to load, which
     the native entry warns about first (index.native.ts:29-34).
  6. CLOSED by #95: http.request_size is now true UTF-8 bytes (and byteLength/size for buffers and blobs).
  7. Query strings are never stripped from the DEPRECATED web `navigation` event's from/to_screen —
     PII/token leak risk (navigationWeb.web.ts handleChange). http.url and http.path no longer exist
     (#95) and view.name's URL rung is normalized with the query dropped (#96), so both are out of
     this gap's scope; only the v5-bound `navigation` feed still carries a raw path.
  8. console.error/warn capture defaults ON (captureConsole=true) — turns every console.error into
     an app.crash event; noisy apps will emit crash events for non-crashes.
  9. wire envelope has no top-level location field though the type name (telemetry_batch) and
     CLAUDE.md target contract mention an optional location (batch.ts:5-12 omits it).
  10. TelemetryOpts.apiKey typed required in createTelemetry (assertApiKey throws on missing/bad
      prefix), but TelemetryWeb/Native constructors still accept apiKey as optional — validation
      only enforced through the factory, not the class.
  11. #92 made sessions resume without re-emitting session.started, so session.reason="launch"
      now UNDERCOUNTS launches — a relaunch inside the idle window emits no row at all. §4.3's
      app.start is the compensator and is NOT built yet (features.app-start = na). Until it
      lands, do not count app launches from session.reason.
  12. #92 session state is read at init and on a web bfcache restore (pageshow, persisted), NOT
      live-synced. Two tabs open at once share the localStorage record but keep their own
      in-memory lastActivity, so they can diverge and both finalize the same session.id. A
      `storage`-event listener would close it; not built (no AC asked for it).
  14a. #96: view.id is resolved at LOG time, not frozen at span start (contract 3.1). Point events
      are unaffected, but an http.request completing after a route change is attributed to the view
      it LANDED in, so view.request_count counts requests completed in the view where 4.5.2 counts
      requests STARTED in it. The freeze ships with the span/trace work (contract 6); no trace.id or
      span.id exists on the wire yet.
  14b. #96: a LOWER rung swallows its own boundary. 4.5.1's "a lower rung arriving later does not
      overwrite a higher one" is implemented literally, so screenStart() once + attachNavigation
      pins the view to the explicit name — route changes stop minting successors and dwell accrues
      under the stale name. 4.5 separately makes route change an unconditional boundary; the two
      readings conflict and need a contract ruling. Workaround: call screenStart() per screen, or
      do not mix it with attachNavigation.
  14c. CLOSED by #97: view.loading_time and view.loading_time_outcome now ship, from one shared
      module (adapters/loadingTime.ts) used by both builds.
  17. #97: settle sees only what the SDK intercepts — JS fetch/XHR. rn-fetch-blob, RN Firebase,
      native Apollo links, expo-file-system, Image loading and WebSocket are outside the
      chokepoint, so a view whose real wait is one of those reports no_activity. Same boundary
      as http.request, and it is exact as "started no JS fetches of its own".
  18. #97: native initial_load is systematically SMALLER than web's — web includes DNS, TLS and
      document download, native reads a bundle off local disk. Cross-platform initial_load
      comparison is not apples-to-apples (contract 4.5.2); within-platform release comparison is
      untouched.
  20. #97: contract 4.5's table says view.loading_time's null has FOUR causes, but the outcome
      domain has only three null-bearing values (settled carries the number). The fourth is not
      identified in the contract and is not produced here. Separately, 4.5 says "Null? yes"
      while 4.11 calls navigation.from_screen "the SDK's only explicit wire null" — the two
      readings conflict, so the key is OMITTED when null, as every other optional key on this
      wire is. Both need a contract ruling; neither was invented locally.
  21. #97: `abandoned` means the user left while it was still loading, and nothing else. A view
      exiting INSIDE the quiet window still reports `settled` — no further request can start in
      a view that is exiting, so quiet is confirmed by construction and the remainder of the
      window is detection delay, which 4.5.2 calls free.
  19. #97: the loading_time clock starts at the route change, NOT at the tap. Tap-to-route-change
      latency runs a handler in the OLD view and belongs to the action envelope (contract 6.6),
      which is not built. A prefetched screen therefore reports no_activity.
  14. #96's `view` event needs the backend allowlist to accept the name before it ships — an
      unlisted eventName is dropped on ingest. It IS in the SDK's ALLOWED_NAMES, so it is emitted.
  15. view.name is mutable within a view's lifetime: rows emitted in the upgrade window (typically
      single-digit ms, between a route event and a mount effect) carry the lower rung's name in
      their Context block. The `view` event's copy is authoritative; the Context copy is a
      join-free convenience (contract 4.5.1).
  16. There is no cardinality guard on the URL rung, by the same reasoning as http.route: a
      client-side rolling collapse would make one row mean different things on different phones.
  13. A Store reporting `unavailable` means the session cannot be resumed, so every launch mints
      one and COUNT(session.started) over-counts that population. There is no session.id_ephemeral
      on the contract to mark it — but the same store failed the device.id round-trip, so those
      events already carry device.id_ephemeral: true. Filter on that.
  22. #98: `app.start` needs backend allowlist sign-off. It is in ALLOWED_NAMES and is being
      emitted; an unlisted eventName is dropped on ingest.
  23. #98: contract 6.7 words the carrier as a MODULE-LEVEL variable. It is implemented as a field
      on a Telemetry-owned TraceManager instead. The substance holds — a plain field read
      synchronously inside the patch, no request tag, no thread-local — and a module singleton
      would let one Telemetry inherit another's live root inside one process, which is the hazard
      that actually exists on a single-threaded runtime. ViewManager is owned the same way.
  24. #98: `trace.root_type = interaction` has NO producer. §6.2's interaction root arrives with
      #102/#103, so `user.interaction` is trace-free today and taps do not start an action.
  25. #98: a NAVIGATION root's `view` row arrives AFTER its own children — fetches during a view
      ship in earlier batches than the `view` event closing it. On RN root-after-child is the
      NORMAL case, not the offline one. Do not assume root-before-child arrival.
  26. #98: web's launch span starts at performance.timeOrigin and native's at SDK initialize().
      Neither is a fork time, and the two are NOT the same interval — do not compare native and
      web launch envelopes.
  27. #98: `view.id` is still resolved at LOG time, not frozen at span start, so an http.request
      completing after a route change carries the ARRIVING view's view.id while its span keys
      belong to the view it started in. That predates #98 (see 12) and the freeze arrives with
      the span/trace work in §6 — but the two now disagree on the same row.
  28. #98: an XHR `send()` that throws synchronously never reaches loadend, so a `request` root it
      minted lives out its 2 s idle window with no row describing it. Rare; the fix is a discard
      sibling on the finisher if the orphan ratio ever justifies one.
  29b. #98: `app.start.js_ready_ms` (contract 4.3) is NOT built — the event ships with only its
      Tier 1 trace keys. The marker is known only when the platform publishes it, and on web
      that is the `load` event, long after `app.start`. Shipping it means either delaying
      `app.start` — and with it the launch root the initial view parents to — or shipping a key
      that is near-always absent on web. Needs a ruling.
  29c. #98: on an expired-record cold launch the rotation RE-MINTS the launch root (rather than
      just clearing the carrier) so trace.id cannot span a session.id. Cost: the retired trace
      keeps one child — the initial `view` row under the old session — and no root row. Same
      condition process death already produces; the alternative broke contract 6.6 invariant 2.
  29. #99: header injection now ships. `traceHostAllowlist` is constructor-only, bare hosts,
      exact match, punycode-normalized, PORTS IGNORED — a deliberate mismatch with http.host,
      which keeps the port. Do not join them. Empty by default: v4 is dark on upgrade.
      evidence src/adapters/traceHeader.ts; traceManager.ts requestTrace()/decide();
      xhrIntercept.ts setRequestHeader patch; web/interceptFetchWeb.web.ts.
  30. #99: a MALFORMED allowlist entry throws in __DEV__ and is dropped in production, reported
      via debug() and therefore SILENT unless debug: true — a stated divergence from Android's
      unconditional require(). The factory calls setDebug() before validating, because the entry
      ctor's own setDebug() runs after and the report would otherwise be a guaranteed no-op.
      The throw is raised in the SYNCHRONOUS createTelemetry() factory, not in core: it is built inside
      instancePromise, which deliberately never rethrows, so a throw there would be a silently
      rejected promise. A direct `new TelemetryWeb()` therefore skips the throw — the same gap
      apiKey already has (see 17).
  31. #99: NEVER-STRIP and READ-SCOPE. The SDK reads exactly one header name (`traceparent`,
      case-insensitive) for exactly one purpose — a presence check — and writes exactly one
      header name, ever. No b3, no tracestate, in either direction. Ownership is the consumer's
      WRITE-TIME presence flag (recorded in the setRequestHeader patch on XHR, read off
      init.headers/Request on fetch), never inferred from the value's shape. The fetch path
      passes a COPY of the headers, so the consumer's Request/Headers object is never mutated.
  32. #99: NO retry-without-the-header and NO preflight probe, both declined on the record —
      a rejected preflight and a dead server are the same TypeError, and retrying would
      double-send a non-idempotent POST. A consumer's OWN retry re-enters the patch and gets a
      fresh span.id: each attempt is its own http.request, so each attempt is its own span.
  33. #99: an UNSAMPLED session injects no header at all — not a flags=00 id. Sampling stays
      session-level; the injected flags byte is always 01.
  34. #99: `injected_expired` vs `injected_unattributed` is decided by reading the carrier field
      BEFORE liveRoot() drops an expired root — a carrier that just aged out is expired (context
      lost), no carrier at all is unattributed (no action). That is the split contract 6.5 asks
      the backend to keep as injected_unattributed_context_lost / _no_action.
  35. #99 OPEN, backend-owned: contract 0.3/6.5's `injected_inbound_malformed`. The live enum
      says INJECT over a malformed inbound header; never-strip says SKIP. RN ships the skip as
      `skipped_consumer_set` and that rung is NOT final. Population is 0 rows either way. Its
      price, said out loud: Android REPAIRS a malformed consumer header and the request becomes
      traceable; here it goes out broken and is unattributed on both ends.
  36. #99 DIVERGENCE from a literal reading of 6.5: with an EMPTY allowlist (the default) no
      `traceparent.outcome` is emitted at all, rather than stamping `skipped_off_allowlist` on
      every row of every consumer who never opted in. "Absent means not traced" is the contract's
      own words and a consumer with no allowlist is not traced; the rung stays reachable the
      moment an allowlist exists and a host is off it. Flag it if the backend wants the constant.
  37a. #99: `sdk.trace_allowlist_size` (contract 4.1) now ships on session.started — COUNT ONLY,
      never the hosts, so a zero is legible as "nobody opted in" rather than as a stripped
      header. evidence telemetry.ts startSession(); traceManager.ts allowlistSize().
  37b. #99: per the fetch spec a NON-EMPTY init resets a Request's referrer and referrerPolicy.
      The web patch carries both across when the consumer passed no init at all, so injecting
      the header is not a behaviour change the SDK was never entitled to make (contract 6.4:
      "the SDK does nothing else at runtime"). evidence web/interceptFetchWeb.web.ts
      carriedReferrer().
  37. #99: `traceparent.outcome` is NOT on contract 3.6's Tier A list, so beforeSend can delete
      or rewrite it (Tier C) — same status as trace.root_type, span.start_time and span.duration_ms.

ci_cd:
  what_exists: >
    .github/workflows/ci.yml — single job on push/PR to master + merge_group: npm ci, npm run
    typecheck (tsc --noEmit), npm test (vitest run), npm run build (vite). Actions pinned by SHA.
    No lint step (repo has no lint script). Contradicts CLAUDE.md's stale note of a yarn/expo CI.
  publishes_to: >
    npm as @nathanclaire/edge-telemetry-sdk (publishConfig.access=public). No publish workflow in
    CI — release/publish appears manual (npm publish); package.json "prepare": vite build builds on install.

open_questions:
  - Is memory_usage meant to sample periodically? If so trackMemoryUsage should call start(), not recordMemoryUsage() once.
  - Should the web build report sdk.platform="web" instead of the hardcoded "react-native"?
  - Are the web-vitals allowlist entries a planned workstream or leftover scaffolding?
  - Backend contract: does the collector expect a top-level `location` in the telemetry_batch envelope? It is not sent.
  - RESOLVED (#94): the offline store now caps at 500 events / 1 MB with app.crash evicted last.
  - Backend: allowlist `app.start` (#98). Until then the event is emitted and dropped on ingest.
  - Backend: contract 6.5's §0.3 — RN's position on a malformed inbound `traceparent` is a SKIP
    (`skipped_consumer_set`), while the live `trace_injection` enum encodes the opposite verb
    (`injected_inbound_malformed`). Needs a ruling before #99 authors that column.
